name: ✨ Feature Request
description: Suggest a new feature or enhancement
title: '[FEATURE] '
labels:
  - enhancement
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        ## Feature Request Guidelines

        Before suggesting a feature, please:
        1. Search existing issues to see if this feature has been requested before
        2. Check if this aligns with the project's goals
        3. Consider starting a discussion in [Discussions](https://github.com/fegome90-cmd/skill_fabrik/discussions) first for larger features
  - type: textarea
    attributes:
      label: Problem Statement
      description: What problem does this feature solve? What use case does it address?
      value: |
        **Is your feature request related to a problem?**
        A clear and concise description of what the problem is.

        Example: "I'm always frustrated when..."
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like to see
      value: |
        **Describe the solution you'd like**
        A clear and concise description of what you want to happen.

        **Describe alternatives you've considered**
        A clear and concise description of any alternative solutions or features you've considered.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Additional Context
      description: Add any other context, mockups, or examples about the feature request
      placeholder: Screenshots, diagrams, examples of similar features in other tools, etc.
  - type: dropdown
    attributes:
      label: Priority
      description: How important is this feature to you?
      options:
        - Low (nice to have)
        - Medium (would be useful)
        - High (important for my use case)
        - Critical (blocking my work)
    validations:
      required: true
