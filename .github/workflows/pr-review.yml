name: PR Review with CoderRabbit

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  coderabbit-review:
    name: CoderRabbit AI Review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: CoderRabbit Review
        uses: coderabbitai/openai-pr-reviewer@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.CODERRABBIT_API_KEY }}
        with:
          # Configuration
          review_simple_changes: true
          review_comment_lgtm: false
          path_filters: |
            *.ts
            *.tsx
            *.js
            *.jsx
            *.md
            *.yml
            *.yaml

      - name: Post Review Summary
        if: always()
        run: |
          echo "CoderRabbit review completed. Check PR comments for detailed feedback."

  conventional-commits:
    name: Validate Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate commit messages
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            test
            chore
            ci
            perf
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" found in commit "{commitMessage}" didn't match the configured pattern.
            Please ensure that the subject doesn't start with an uppercase character.
