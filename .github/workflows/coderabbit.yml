name: CoderRabbit Configuration

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  coderabbit:
    name: CoderRabbit AI Code Review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: CoderRabbit Review
        uses: coderabbitai/openai-pr-reviewer@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.CODERRABBIT_API_KEY }}
        with:
          # Comportamiento del bot
          review_simple_changes: true
          review_comment_lgtm: false
          review_comment_lgtm_message: 'This PR looks good to me! ✅'
          # Habilitar reviews para PRs de bots (Dependabot, etc.)
          review_bot_prs: true

          # Configuración de reviews
          path_filters: |
            **/*.ts
            **/*.tsx
            **/*.js
            **/*.jsx
            **/*.md
            **/*.yml
            **/*.yaml

          # Ignorar ciertos paths
          ignore: |
            **/*.min.js
            **/*.lock
            **/node_modules/**
            **/dist/**

          # Lenguaje para reviews
          language: es

          # Análisis adicional
          review_consistency: true
          review_tests: true
          review_documentation: true

      - name: Post Review Summary
        if: always()
        run: |
          echo "✅ CoderRabbit review completado. Revisa los comentarios en el PR."
